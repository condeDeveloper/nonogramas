name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  testes:
    name: testes (${{ matrix.so }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.so }}
    strategy:
      fail-fast: false
      matrix:
        so: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # O glob precisa do bash: no PowerShell do runner o `testes/*.test.js`
      # chega ao node como texto literal e ele procura um arquivo com
      # asterisco no nome.
      - name: nucleo e medidas
        shell: bash
        run: node --test testes/nucleo.test.js testes/medidas.test.js
      - name: varreduras grandes
        shell: bash
        run: node --test testes/pesados.test.js

  medidas:
    name: tabelas do README
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: quantas dicas cabem numa linha
        run: node ferramentas/medidor.js dicas
      - name: conferencia contra a forca bruta
        run: node ferramentas/medidor.js juiz
      - name: ambiguidade
        run: node ferramentas/medidor.js ambiguidade
      - name: o exemplo que a propagacao nao comeca
        run: node ferramentas/medidor.js exemplo
      - name: censo de todas as caixas
        run: node ferramentas/medidor.js censo
      - name: propagacao
        run: node ferramentas/medidor.js propagacao
